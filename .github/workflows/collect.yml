name: Collect wait times

on:
  schedule:
    # CBP updates hourly; polling twice an hour catches each update despite scheduler delays
    # and stays inside the 2,000 free Actions minutes a private repo gets per month
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install collector dependencies
        run: pip install requests==2.31.0 && pip install --no-deps -e .

      - name: Collect
        run: python -m border_predictor.collector

      - name: Commit new readings
        run: |
          git config user.name "wait-time-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/collected
          if git diff --cached --quiet; then
            echo "No new readings"
            exit 0
          fi
          git commit -m "Collect wait times $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
